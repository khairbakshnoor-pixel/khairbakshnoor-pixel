  <text x="72" y="111" fill="#D4AF37" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">AI AUTOMATION  /  VOICE  /  DATA</text>
  <text x="70" y="181" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" letter-spacing=".5">KHAIR BAKHSH</text>
  <text x="72" y="222" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" letter-spacing="2">NOOR DAD</text>
  <text x="72" y="265" fill="#C7D2E0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Building intelligent agents, automations, and real-world AI solutions.</text>
  <text x="72" y="300" fill="#20D9FF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">KARACHI, PAKISTAN  ·  BUILDING GLOBALLY</text>
