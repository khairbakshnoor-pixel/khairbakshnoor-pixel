<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Khair Bakhsh Noor Dad — AI Automation Engineer</title>
  <desc id="description">A premium dark portfolio banner with a connected AI workflow illustration: customer conversation, intelligent agent, automation, and business systems.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset=".62" stop-color="#101827"/>
      <stop offset="1" stop-color="#0B1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#20D9FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172333" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0D1520" stop-opacity=".98"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F8FAFC" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#20D9FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#20D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <ellipse cx="1000" cy="180" rx="280" ry="220" fill="url(#glow)"/>
